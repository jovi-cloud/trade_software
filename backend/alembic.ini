[alembic]
script_location = alembic

# Makes `app` importable when running alembic from the backend/ directory.
prepend_sys_path = .

# Migration filenames sort chronologically and describe the change:
#   20260801_1420_add_config_hash_to_backtest_runs.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# The URL is resolved from app settings in env.py, not hard-coded here.
sqlalchemy.url =

[post_write_hooks]
# `exec` rather than `console_scripts`: ruff ships as a binary shim, which
# alembic cannot resolve as an entry point.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
