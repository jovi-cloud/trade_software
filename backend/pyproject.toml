[project]
name = "backtesting-backend"
version = "0.1.0"
description = "Trading Strategy Research Platform - backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "python-ulid>=3.0",
    "python-multipart>=0.0.20",
    # Data / engine libraries. Declared now so the dependency set is stable;
    # first used in Phase 1 (data) and Phase 3 (engine).
    "polars>=1.17",
    "pyarrow>=18.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "import-linter>=2.1",
    "pandas-stubs>=2.2",
]

[tool.uv]
# Application, not a distributable library: nothing to build or install.
package = false

# ----------------------------------------------------------------------------
# Ruff - lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "ANN",      # missing type annotations
    "TID",      # tidy imports
]
ignore = [
    "ANN401",  # allow typing.Any where genuinely needed
    "B008",    # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"alembic/**" = ["ANN", "E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ----------------------------------------------------------------------------
# mypy - strict in the pure layers, standard elsewhere
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["app.engine.*", "app.domain.*", "app.data.*", "app.analytics.*"]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

# ----------------------------------------------------------------------------
# import-linter - enforces the layer contract from ARCHITECTURE.md 2.1
# ----------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
# Required because the contracts below forbid third-party imports (fastapi,
# sqlalchemy, pydantic) inside the engine and domain layers.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: api -> services -> repositories -> models -> db"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.models",
    "app.db",
]

[[tool.importlinter.contracts]]
name = "Engine is framework-free"
type = "forbidden"
source_modules = ["app.engine"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.models",
    "app.db",
    "app.schemas",
    "app.analytics",
    "app.comparison",
    "fastapi",
    "sqlalchemy",
    "pydantic",
]

# The analytics layer is a leaf beside the engine, not inside it: it consumes
# plain records and returns a report. Keeping it framework-free and
# engine-independent is what lets optimisation, walk-forward, Monte Carlo and
# PDF export reuse it, and what lets it be tested without a bar loop.
[[tool.importlinter.contracts]]
name = "Analytics is a pure leaf layer"
type = "forbidden"
source_modules = ["app.analytics"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.models",
    "app.db",
    "app.schemas",
    "app.engine",
    "app.data",
    "fastapi",
    "sqlalchemy",
    "pydantic",
]

[[tool.importlinter.contracts]]
name = "Comparison is a pure leaf layer"
type = "forbidden"
source_modules = ["app.comparison"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.models",
    "app.db",
    "app.schemas",
    "app.engine",
    "app.data",
    "fastapi",
    "sqlalchemy",
    "pydantic",
]

[[tool.importlinter.contracts]]
name = "Data layer knows nothing of services or ORM"
type = "forbidden"
source_modules = ["app.data"]
forbidden_modules = ["app.api", "app.services", "app.repositories", "app.models", "fastapi"]

[[tool.importlinter.contracts]]
name = "Domain is stdlib-only"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.models",
    "app.db",
    "app.engine",
    "app.data",
    "app.analytics",
    "app.comparison",
    "fastapi",
    "sqlalchemy",
    "pydantic",
]
